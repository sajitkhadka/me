apiVersion: apps/v1
kind: Deployment
metadata:
  name: me
  labels:
    app: me
spec:
  replicas: 1
  selector:
    matchLabels:
      app: me
  template:
    metadata:
      labels:
        app: me
    spec:
      # Brings the database schema up to date before the app starts. Same image as the app, so the
      # release workflow's image-line sed updates both. It never passes --accept-data-loss: a change
      # that would drop data fails here, the rollout stops, and the old pod keeps serving.
      initContainers:
      - name: db-push
        image: 192.168.0.120:5000/me:placeholder
        imagePullPolicy: Always
        command: ["node", "/opt/prisma/node_modules/prisma/build/index.js", "db", "push", "--schema", "/app/db/schema", "--skip-generate"]
        envFrom:
        - secretRef:
            name: me-secrets
        resources:
          limits:
            memory: "512Mi"
          requests:
            cpu: "0.05"
            memory: "128Mi"
      containers:
      - name: me
        image: 192.168.0.120:5000/me:placeholder
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: me-config
        # Created in ticket 0024 as a sealed secret. Apply that before this Deployment.
        - secretRef:
            name: me-secrets
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.1"
            memory: "192Mi"
      imagePullSecrets:
      - name: regcred
